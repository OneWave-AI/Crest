name: CrestPhone
options:
  bundleIdPrefix: com.onewave
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.1.0
    CURRENT_PROJECT_VERSION: 2
packages:
  CrestSDK:
    path: ../sdk/swift
targets:
  CrestPhone:
    type: application
    platform: iOS
    sources: [CrestPhone]
    dependencies:
      - package: CrestSDK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onewave.crest.phone
        PRODUCT_NAME: Crest
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Crest
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect securely to Crest on your laptop to chat with local Qwen and work on your selected projects.
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the one-time pairing QR code shown by Crest on your laptop.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    info:
      path: CrestPhone/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLSchemes: [crest]
            CFBundleURLName: com.onewave.crest.pair
  CrestPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CrestPhoneTests]
    dependencies:
      - target: CrestPhone
      - package: CrestSDK
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Crest.app/Crest
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  CrestPhone:
    build:
      targets:
        CrestPhone: all
    test:
      targets: [CrestPhoneTests]
